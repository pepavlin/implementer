name: ${INSTANCE_NAME:-implementer}

services:
    implementer:
        restart: unless-stopped
        cpus: 0.5
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${PORT:-3000}:${PORT:-3000}"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - workspace:/app/workspace
        environment:
            - WORKSPACE_VOLUME=${INSTANCE_NAME:-implementer}_workspace
            - INSTANCE_NAME=${INSTANCE_NAME:-implementer}
            - SANDBOX_IMAGE=${INSTANCE_NAME:-implementer}-sandbox
            - PORT=${PORT:-3000}

    # Build-only: produces the sandbox image used by executor.
    # Not started by `docker compose up` — only built by `docker compose build`.
    sandbox:
        build:
            context: .
            dockerfile: Dockerfile.sandbox
        image: ${INSTANCE_NAME:-implementer}-sandbox
        profiles:
            - build-only

volumes:
    workspace:
        name: ${INSTANCE_NAME:-implementer}_workspace
