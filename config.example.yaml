server:
    workspaceDir: ./workspace
    # Global cap on tasks running simultaneously across all projects (optional)
    maxConcurrentTasks: 10
    # Password for the /dashboard admin UI (optional).
    # If not set, the dashboard is accessible without authentication.
    # Supports ${ENV_VAR} substitution.
    # adminPassword: ${DASHBOARD_PASSWORD}
    # Global webhook secret for the unified webhook endpoint (optional).
    # When set, all GitHub repositories can use a single webhook URL:
    #   POST /webhook/github
    # The handler auto-detects the project from the repository name in the payload.
    # All GitHub webhooks pointing to this URL must use the same secret.
    # Supports ${ENV_VAR} substitution.
    # webhookSecret: ${GITHUB_WEBHOOK_SECRET}

# Global defaults merged into every project's claudeCode (optional).
# systemPrompt is concatenated (global + project); mcpServers are shallow-merged (project overrides global).
# defaults:
#     systemPrompt: |
#         Global instructions applied to all projects.
#     mcpServers:
#         playwright:
#             command: npx
#             args: ["@playwright/mcp@latest", "--headless"]

projects:
    demo-webapp:
        maxConcurrentTasks: 2
        repositories:
            - name: demo-webapp
              url: https://github.com/your-org/demo-webapp.git
              defaultBranch: main
        auth:
            # Use claudeOauthRefreshToken for long-lived auth (auto-refreshes access tokens).
            # Get it from ~/.claude.json after running: claude setup-token
            claudeOauthRefreshToken: ${CLAUDE_OAUTH_REFRESH_TOKEN}
            # Or use claudeOauthToken for a static access token (~1h lifetime, no auto-refresh).
            # claudeOauthToken: ${CLAUDE_CODE_OAUTH_TOKEN}
            githubToken: ${GITHUB_TOKEN}
        apiKey: demo-webapp-secret
        # Automatically retry failed tasks (optional)
        # maxAttempts = total attempts including the first (e.g. 3 = 1 original + 2 retries)
        # errorRetry:
        #     maxAttempts: 3
        #     delaySeconds: 60
        # Paths Claude must not modify — changes are reverted before PR creation (optional)
        # Supports exact filenames, directories, and git pathspec patterns
        # protectedPaths:
        #     - .github
        #     - Dockerfile
        #     - docker-compose.yml
        # GitHub webhook secret for real-time PR/pipeline event notifications (optional).
        # When configured, the project accepts webhook events at:
        #   POST /webhook/github/<projectId>
        # Configure the same secret in your GitHub repo → Settings → Webhooks.
        # Events to enable: Pull requests, Check runs, Check suites, Workflow runs.
        # Supports ${ENV_VAR} substitution.
        # webhookSecret: ${GITHUB_WEBHOOK_SECRET}
        # Monitor specific CI/CD pipeline jobs on the PR and auto-retry on failure (optional).
        # When configured, tasks wait in "waiting_for_pipeline" status after PR creation.
        # Only the listed pipeline job names are checked — all others are ignored.
        # If any listed job fails, the implementer is automatically re-triggered to fix
        # the code (up to retryCount times). Other tasks can start while waiting.
        # handlePipelines:
        #     # CI/CD pipeline job names to monitor (required)
        #     pipelines:
        #         - build
        #         - test
        #         - lint
        #     # How many automatic fix attempts to allow when a pipeline fails.
        #     # Defaults to 1. Set to 0 to disable auto-retry (only wait and fail).
        #     retryCount: 1
        claudeCode:
            command: claude
            model: sonnet
            # systemPrompt: |
            #   Custom instructions applied to every task.
            #   e.g. "Always write tests. Follow existing code style."
            # Maximum wall-clock seconds a single executor run may take.
            # Defaults to 3600 (1 hour) — you do NOT need to set this unless you want a different value.
            # On timeout the task is set to "retrying" (not failed) and its branch is preserved;
            # after a server restart (or manual /retry) it resumes on the same branch from where it left off.
            # Timeouts always retry regardless of whether errorRetry is configured. Minimum: 60.
            # timeoutSeconds: 3600
            mcpServers:
                playwright:
                    command: npx
                    args:
                        [
                            "@playwright/mcp@latest",
                            "--headless",
                            "--browser",
                            "chromium"
                        ]
