server:
    workspaceDir: ./workspace

projects:
    demo-webapp:
        maxConcurrentTasks: 2
        repositories:
            - name: demo-webapp
              url: https://github.com/your-org/demo-webapp.git
              defaultBranch: main
        auth:
            claudeOauthToken: claude-oauth-demo-webapp
            githubToken: ghp-demo-webapp
        apiKey: demo-webapp-secret
        claudeCode:
            command: claude
            model: sonnet
            # systemPrompt: |
            #   Custom instructions applied to every task.
            #   e.g. "Always write tests. Follow existing code style."
            mcpServers:
                playwright:
                    command: npx
                    args:
                        [
                            "@playwright/mcp@latest",
                            "--headless",
                            "--browser",
                            "chromium"
                        ]
